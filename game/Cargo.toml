[package]
name    = "gamejam-001"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
bevy = { version = "0.20.0" }
log  = { version = "0.4.34" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
rand = { version = "0.10.4" }
strum = { version = "0.28.0", features = ["derive"] }

# Special config for web assembly target (for itch.io build)
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to match wasm-bindgen (see: flake.nix, Justfile/build-web-release).
# CLI's version must exactly match the `wasm-bindgen` crate baked into the
# .wasm, or it refuses to run.
wasm-bindgen = "=0.2.129"
# Normally using rand means using the OS's getrandom().
# But that's not available on WASM => need a crate that support it.
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[features]
# Development build
dev = [
	"bevy/dynamic_linking",
	"bevy/file_watcher",
]
